server {
    listen 80;

    # Allow the upload size to be up to 100MB.
    client_max_body_size 100M;                       

    # React production build directory
    root /usr/share/nginx/html;

    # Add once the API Service exists. nginx refuses to start if this host can't be found.
    location /api/ { 
        proxy_pass http://arcade-hub-api-service:5080; 
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}