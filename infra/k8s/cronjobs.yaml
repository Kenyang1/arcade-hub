
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idle-sweep
  namespace: arcade
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: idle-sweep
              image: busybox:latest
              command:
                - /bin/sh
                - -c
                - echo "Not implemented yet."
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "1"
          restartPolicy: OnFailure

