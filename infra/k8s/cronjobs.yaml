
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idle-sweep
  namespace: arcade
spec:
  schedule: "*/5 * * * *"    # Run every 5 minutes.
  timeZone: "America/New_York"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: idle-sweep
              image: arcade-api:dev
              imagePullPolicy: IfNotPresent

              command:
                - node
                - /arcade-hub/api/dist/jobs/cli.js
                - idle-sweep

              env:
                - name: MONGO_URL
                  value: "mongodb://mongo:27017"
                - name: MONGO_DB
                  value: "arcadehub"

              resources:
                requests:
                  memory: "128Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "1"
          restartPolicy: OnFailure

