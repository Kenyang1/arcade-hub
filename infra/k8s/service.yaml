apiVersion: v1
kind: Service

metadata:
  name: arcade-hub-api-service
  namespace: arcade

spec:
  type: ClusterIP

  selector:
    app: arcade-api

  ports:
    - protocol: TCP
      port: 5080
      targetPort: 5080

---
apiVersion: v1
kind: Service

metadata:
  name: arcade-hub-web-service
  namespace: arcade

spec:
  type: NodePort

  selector:
    app: arcade-web

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
