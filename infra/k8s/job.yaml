apiVersion: batch/v1
kind: Job
metadata:
  name: gridfs-import
  namespace: arcade

spec:
  backoffLimit: 2

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: importer
          image: gridfs-importer:1.0
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Starting GridFS import..."

              find /data/files -type f -print0 |
              while IFS= read -r -d '' file; do

                filename="${file#/data/files/}"

                echo "Uploading: $filename"

                mongofiles \
                  --host mongo \
                  --port 27017 \
                  --db arcade \
                  --prefix gameFiles \
                  --username "$MONGO_USERNAME" \
                  --password "$MONGO_PASSWORD" \
                  --authenticationDatabase admin \
                  --replace \
                  --local "$file" \
                  put "$filename"

              done

              echo "GridFS import completed!"

          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: username

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: password

          volumeMounts:
            - name: staging-volume
              mountPath: /data/files
              readOnly: true

      volumes:
        - name: staging-volume
          persistentVolumeClaim:
            claimName: gridfs-staging