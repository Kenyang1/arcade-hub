---
apiVersion: v1
kind: Service

metadata:
  name: mongo
  namespace: arcade

spec:
  clusterIP: None # headless: gives the StatefulSet pod a stable DNS name

  selector:
    app: arcade-mongo

  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongo
  namespace: arcade

spec:
  serviceName: mongo
  replicas: 1

  selector:
    matchLabels:
      app: arcade-mongo

  template:
    metadata:
      labels:
        app: arcade-mongo

    spec:
      containers:
        - name: mongo
          image: mongo:8 # same as docker-compose.yml
          imagePullPolicy: IfNotPresent

          # Keep MongoDB's cache inside the memory limit below.
          args: ["--wiredTigerCacheSizeGB", "0.25"]

          ports:
            - containerPort: 27017
              name: mongo

          # Allows MongoDB up to 150 seconds to initialize.
          startupProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /data/db

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi    

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gridfs-staging
  namespace: arcade
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: gridfs-staging
  namespace: arcade
spec:
  restartPolicy: Never

  containers:
    - name: staging
      image: busybox:1.37
      command: ["sh", "-c", "sleep 36000"]

      volumeMounts:
        - name: staging-volume
          mountPath: /data/files

  volumes:
    - name: staging-volume
      persistentVolumeClaim:
        claimName: gridfs-staging