apiVersion: apps/v1
kind: Deployment

metadata:
  name: arcade-hub-api-deployment
  namespace: arcade

spec:
  replicas: 1

  selector:
    matchLabels:
      app: arcade-api

  template:
    metadata:
      labels:
        app: arcade-api

    spec:
      containers:
        - name: arcade-api
          image: arcade-api:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5080
              protocol: TCP

          env:
            - name: PORT
              value: "5080"
            - name: MONGO_URL
              value: "mongodb://mongo:27017"
            - name: MONGO_DB
              value: "arcadehub"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: arcade-hub-web-deployment
  namespace: arcade

spec:
  replicas: 1

  selector:
    matchLabels:
      app: arcade-web

  template:
    metadata:
      labels:
        app: arcade-web

    spec:
      containers:
        - name: arcade-web
          image: arcade-web:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              name: http

          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"

