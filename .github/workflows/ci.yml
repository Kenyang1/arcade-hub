name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Print message
        run: echo "A pull request has been made."

      # Checkout the repo.
      - name: Checkout
        uses: actions/checkout@v6

        # Install pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Install node.js.
      - name: Install node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # Install dependencies
      - name: Install dependencies
        working-directory: ./
        run: pnpm install --frozen-lockfile

      # Verify MongoDB connection.
      - name: Verify MongoDB Connection
        run: |
          # The service is now accessible on localhost:27018 from the runner host context
          echo "Testing connection to MongoDB on port 27018..."
          nc -zv localhost 27018

      # Build the frontend and backend.
      - name: Test and build the frontend and backend
        working-directory: ./
        run: |
          pnpm --dir web lint
          pnpm --dir web typecheck
          pnpm --dir web build
          pnpm --dir packages/contracts typecheck
          pnpm --dir api lint
          pnpm --dir api typecheck
          pnpm --dir api test
          pnpm --dir api build
#          npx newman run tests/arcade-hub.postman_collection.json -e tests/local.postman_environment.json

      # Build a Docker image for the API.
      - name: Build API Docker image
        run: |
          docker build \
            -f infra/docker/api.Dockerfile \
            -t arcade-api:test \
            .

      # Build a Docker image for the web app.
      - name: Build Web Docker image
        run: |
          docker build \
            -f infra/docker/web.Dockerfile \
            --build-arg NGINX_CONFIG=infra/nginx/nginx_ci.conf \
            -t arcade-web:test \
            .

      # One network for the smoke test, so containers can find each other by name.
      - name: Create Docker network
        run: docker network create arcade-ci

      # Run an API container.
      - name: Run API Docker container
        run: |
          docker run -d \
            --name arcade-api \
            --network arcade-ci \
            --network-alias arcade-hub-api-service \
            --add-host=host.docker.internal:host-gateway \
            -p 5080:5080 \
            -e PORT=5080 \
            -e MONGO_URL=mongodb://host.docker.internal:27018 \
            -e MONGO_DB=arcadehub \
            arcade-api:test

      # Test API health endpoint.
      - name: Test API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5080/api/health | grep -q '"mongo":"up"'; then
              echo "API is up and connected to MongoDB."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API failed to start or can't reach MongoDB."
          exit 1

      # Run the web app with the real nginx.conf. Must start after the API,
      # because nginx looks up arcade-hub-api-service once, at startup.
      - name: Run Web Docker container
        run: |
          docker run -d \
            --name arcade-web \
            --network arcade-ci \
            -p 8080:80 \
            arcade-web:test

      # Test the web application.
      - name: Test Web application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8080/ | grep -q 'id="root"' \
              && curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "Web app is serving and proxying /api."
              exit 0
            fi
            echo "Waiting for web app..."
            sleep 2
          done
          echo "Web app failed."
          exit 1

      # Print both containers' logs when anything above failed.
      - name: Show container logs
        if: failure()
        run: |
          docker logs arcade-api || true
          docker logs arcade-web || true

      # Clean up the web app container.
      - name: Stop web container
        if: always()
        run: |
          docker stop arcade-web || true
          docker rm arcade-web || true

      # Clean up the API container.
      - name: Stop API container
        if: always()
        run: |
          docker stop arcade-api || true
          docker rm arcade-api || true

      # Print a confirmation message.
      - name: Print a confirmation message.
        run: echo "Success."