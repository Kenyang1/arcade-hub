# One workspace for the whole repo. `pnpm install` at the root installs every
# package; run a package's scripts with `pnpm --dir <folder> <script>`.
packages:
  - web
  - api
  - packages/*

# Only install package versions published at least 14 days ago (in minutes).
minimumReleaseAge: 20160

# Platform bindings that were already in the lockfile before the rule above
# existed. Without this, `pnpm add` refuses to re-resolve them until they turn
# 14 days old. Remove this list after Nov 10, 2026.
minimumReleaseAgeExclude:
  - '@oxlint/binding-*'
  - '@rolldown/binding-*'
